project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - lesson1.qmd
    - lesson1-tasks.qmd
    - lesson2.qmd
    - lesson2-tasks.qmd
    - lesson3.qmd
    - lesson3-tasks.qmd
    - lesson4-2-supervised-learning.qmd
    - references.qmd

website:
  title: Image Processing for Remote Sensing
  page-navigation: true
  sidebar:
    contents:
      - index.qmd
      - lesson1-tasks.qmd
      - lesson2-tasks.qmd
      - lesson3-tasks.qmd
      # - lesson4-2-supervised-learning.qmd
      - references.qmd

format:
  html:
    number-depth: -1
    number-sections: false
    css: misc/book-style.css
    include-in-header:
      - misc/script.html
    theme:
      light: [flatly]
      dark: [flatly, "misc/presenter.scss"]
    highlight-style:
      light: misc/arrow-light.theme
      dark: misc/arrow-light.theme

bibliography: misc/bibliography.bib
execute:
  warning: false
  message: false
  echo: false
freeze: true




